name: Seasonal Fall Foliage Data Sync (Jul 1 - Nov 30) & Historical Archive Backfill

on:
  schedule:
    # Runs once daily at 06:00 UTC ONLY during July, August, September, October, and November (months 7-11).
    # Zero automatic runs occur from December 1 through June 30.
    - cron: '0 6 * 7-11 *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force a manual current-season snapshot build even outside Jul 1 - Nov 30'
        required: false
        default: 'true'
        type: string
      backfill_history:
        description: 'Optional: Backfill static GitHub historical copies in data/historical/ (e.g. "1950-2025" or "2010-2025")'
        required: false
        default: ''
        type: string
      history_source:
        description: 'Historical data source when backfilling ("noaa" for NOAA RCC-ACIS or "era5" for Open-Meteo ERA5)'
        required: false
        default: 'noaa'
        type: string

permissions:
  contents: write

jobs:
  sync-foliage-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch NOAA / Open-Meteo Forecast & Build Foliage Snapshot (or Backfill 1950-2025 History)
        env:
          FORCE_RUN: ${{ github.event.inputs.force_run || (github.event_name == 'workflow_dispatch' && 'true' || 'false') }}
          BACKFILL_HISTORY_RANGE: ${{ github.event.inputs.backfill_history || '' }}
          HISTORY_SOURCE: ${{ github.event.inputs.history_source || 'noaa' }}
        run: |
          python3 scripts/build_foliage_snapshot.py

      - name: Commit & Deploy Updated Snapshots / Historical Archive to GitHub Pages
        run: |
          git config user.name "peakfolio-data-bot"
          git config user.email "bot@peakfolio.app"
          for path in foliage-forecast-snapshot.json data/archive data/historical; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --staged --quiet; then
            echo "No snapshot or historical changes to commit."
          else
            git commit -m "chore(data): update PeakFolio foliage snapshots & historical archive ($(date -u +'%Y-%m-%d'))"
            git push
          fi
